name: CI

# No secret is needed by any job. The unit suite runs in test mode with fake values
# and blocks socket access, the SQL suite uses a disposable local container, and the
# image build receives no credentials. Nothing here contacts a real provider.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Dependency tree is consistent
        run: python -m pip check

      - name: Lint
        run: python -m ruff check .

      - name: Formatting
        run: python -m ruff format --check .

      - name: Static types
        run: python -m mypy

      - name: Unit tests
        run: python -m pytest -q

  database:
    name: Migrations and SQL checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Mirrors tests/README.md exactly, so local and CI verification cannot drift.
      # The container publishes no port and has no network; psql runs through docker exec.
      - name: Start disposable PostgreSQL
        run: |
          docker run --detach --name second-brain-receipts-v006-db --network none \
            --tmpfs /var/lib/postgresql/data -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17
          for _ in $(seq 1 30); do
            if docker exec second-brain-receipts-v006-db pg_isready -U postgres; then exit 0; fi
            sleep 2
          done
          echo "PostgreSQL did not become ready" >&2
          exit 1

      - name: Create stand-in Supabase roles
        run: |
          docker exec second-brain-receipts-v006-db psql -U postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role BYPASSRLS;'

      - name: Apply migrations from scratch
        run: |
          for file in supabase/migrations/*.sql; do
            echo "applying $file"
            docker exec -i second-brain-receipts-v006-db \
              psql -U postgres -v ON_ERROR_STOP=1 -q < "$file"
          done

      - name: Constraint, index and privilege checks
        run: |
          docker exec -i second-brain-receipts-v006-db \
            psql -U postgres -v ON_ERROR_STOP=1 -q < tests/database/constraints.sql

      - name: Atomic completion and cleanup checks
        run: |
          docker exec -i second-brain-receipts-v006-db \
            psql -U postgres -v ON_ERROR_STOP=1 -q < tests/database/pending_workflow.sql

      - name: Concurrency and lock-contention checks
        run: |
          python tests/database/check_races.py
          python tests/database/check_pending_races.py

      - name: Remove disposable database
        if: always()
        run: docker rm --force second-brain-receipts-v006-db

  image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build --tag second-brain-receipts:ci .

      # Start-up and routing only: fake values prove no real credential is required
      # to boot, and that an unauthenticated webhook is rejected before any work.
      - name: Start and smoke test
        run: |
          docker run --detach --name sbr-ci --publish 8000:8000 \
            --env APP_ENV=production \
            --env OPENAI_API_KEY=ci-not-a-real-key \
            --env TELEGRAM_BOT_TOKEN=123:ci-not-a-real-token \
            --env TELEGRAM_WEBHOOK_SECRET=ci-not-a-real-secret \
            --env TELEGRAM_ALLOWED_USER_ID=123 \
            --env SUPABASE_URL=https://example.invalid \
            --env SUPABASE_SERVICE_ROLE_KEY=ci-not-a-real-key \
            --env AWS_REGION=ap-southeast-1 \
            --env S3_BUCKET_NAME=ci-test-bucket \
            second-brain-receipts:ci

          for _ in $(seq 1 30); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:8000/health; then break; fi
            sleep 1
          done

          echo
          test "$(curl --silent --max-time 5 http://127.0.0.1:8000/health)" = '{"status":"ok"}'
          echo "health endpoint ok"

          status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5 \
            --request POST http://127.0.0.1:8000/webhooks/telegram \
            --header 'Content-Type: application/json' --data '{"update_id":1}')
          test "$status" = "401"
          echo "unauthenticated webhook rejected with 401"

      - name: Image runs as an unprivileged user
        run: |
          test "$(docker inspect --format '{{.Config.User}}' second-brain-receipts:ci)" = "appuser"
          echo "runs as appuser"

      - name: No .env baked into any layer
        run: |
          if docker run --rm --entrypoint sh second-brain-receipts:ci \
              -c 'find / -name ".env" -not -path "/proc/*" 2>/dev/null | grep .'; then
            echo "found a .env inside the image" >&2
            exit 1
          fi
          echo "no .env present"

      - name: Container logs
        if: always()
        run: docker logs sbr-ci || true

      - name: Remove container
        if: always()
        run: docker rm --force sbr-ci || true
